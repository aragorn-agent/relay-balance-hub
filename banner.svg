<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#101a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b7cfa"/>
      <stop offset="0.5" stop-color="#8957e5"/>
      <stop offset="1" stop-color="#2ea043"/>
    </linearGradient>
    <linearGradient id="term" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0b0f14"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="6" fill="url(#accent)"/>
  <circle cx="1180" cy="90" r="160" fill="#5b7cfa" opacity="0.07"/>
  <circle cx="90" cy="560" r="200" fill="#8957e5" opacity="0.06"/>

  <text x="640" y="118" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="26" fill="#8b949e">⚡ 零依赖 · 一条命令 · 所有中转站余额</text>

  <text x="640" y="196" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="64" font-weight="bold" fill="#e6edf3">relay-balance-hub</text>

  <text x="640" y="252" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="30" fill="#c9d1d9">多站 LLM API 余额，聚合成一张表</text>

  <!-- terminal window -->
  <rect x="240" y="300" width="800" height="230" rx="12" fill="url(#term)" stroke="#30363d" stroke-width="1"/>
  <circle cx="270" cy="326" r="7" fill="#ff5f56"/>
  <circle cx="292" cy="326" r="7" fill="#ffbd2e"/>
  <circle cx="314" cy="326" r="7" fill="#27c93f"/>
  <text x="700" y="331" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#8b949e">terminal</text>

  <text x="270" y="372" font-family="Consolas, monospace" font-size="18" fill="#e6edf3">$ npx relay-balance-hub</text>

  <text x="270" y="408" font-family="Consolas, monospace" font-size="16" fill="#e6edf3">321AI    https://321ai.cc      $10.00    $0.38     $9.62   OK</text>
  <text x="270" y="434" font-family="Consolas, monospace" font-size="16" fill="#e6edf3">relay-b  https://b.example      $5.00    $1.20     $3.80   OK</text>
  <text x="270" y="460" font-family="Consolas, monospace" font-size="16" fill="#e6edf3">relay-c  https://c.example         —         —         —   </text>
  <text x="782" y="460" font-family="Consolas, monospace" font-size="16" fill="#f85149">ERROR: unauthorized</text>

  <text x="270" y="502" font-family="Consolas, monospace" font-size="16" fill="#8b949e">─────────────────────────────────────────────</text>
  <text x="270" y="522" font-family="Consolas, monospace" font-size="16" fill="#e6edf3">TOTAL</text>
  <text x="812" y="522" text-anchor="end" font-family="Consolas, monospace" font-size="16" font-weight="bold" fill="#2ea043">$13.42 remaining</text>

  <text x="640" y="596" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#8b949e">keys stay local · zero dependencies · Node ≥ 16 · MIT</text>
</svg>
